<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2786" viewBox="0 0 960 2786" role="img" aria-label="LT9611 完整调用流程：probe 建链（drm_bridge_attach 调用关系）→ 插入 → 点亮 → 拔出" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif">

<defs>
<marker id="ltar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
</marker>
<marker id="ltar-b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
</marker>
<marker id="ltar-g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
</marker>
</defs>
<rect x="24" y="24" width="912" height="946" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="24" y="24" width="912" height="34" rx="10" fill="#0ea5e9"/>
<rect x="24" y="48" width="912" height="10" fill="#0ea5e9"/>
<text x="40" y="46" font-size="14.5" font-weight="700" fill="#ffffff">probe 建链</text>
<rect x="40" y="76" width="876" height="192" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
<text x="58" y="108"><tspan fill="#0f172a" font-size="13" font-weight="600">① lt9611 驱动侧（lt9611.c）</tspan></text>
<text x="58" y="134"><tspan fill="#2563eb" font-size="12" font-weight="600">lt9611_probe()</tspan></text>
<text x="58" y="160"><tspan fill="#475569" font-size="12">├─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">lt9611_parse_dt()</tspan><tspan fill="#475569" font-size="12">　← 解析 DT，取出 next_bridge（HDMI connector）</tspan></text>
<text x="58" y="186"><tspan fill="#475569" font-size="12">├─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">drm_bridge_add(&amp;lt9611-&gt;bridge)</tspan><tspan fill="#475569" font-size="12">　← 只挂进 DRM 全局列表</tspan></text>
<text x="58" y="212"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">lt9611_attach_dsi()</tspan><tspan fill="#475569" font-size="12">　← 把 LT9611 这个 DSI 设备接到 host 上</tspan></text>
<text x="86" y="238"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="114" fill="#2563eb" font-size="12" font-weight="600">mipi_dsi_attach(dsi)</tspan></text>
<rect x="40" y="300" width="876" height="192" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
<text x="58" y="332"><tspan fill="#0f172a" font-size="13" font-weight="600">② 上游 DSI host 侧（mtk_dsi.c）</tspan></text>
<text x="58" y="358"><tspan fill="#2563eb" font-size="12" font-weight="600">.attach = mtk_dsi_host_attach</tspan></text>
<text x="58" y="384"><tspan fill="#475569" font-size="12">├─ </tspan><tspan x="86" fill="#475569" font-size="12">记下 lanes / format / mode_flags；取出 next_bridge</tspan></text>
<text x="58" y="410"><tspan fill="#475569" font-size="12">├─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">drm_bridge_add(&amp;dsi-&gt;bridge)</tspan><tspan fill="#475569" font-size="12">　← 只挂进全局列表，还没 attach</tspan></text>
<text x="58" y="436"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">component_add(&amp;mtk_dsi_component_ops)</tspan><tspan fill="#475569" font-size="12">　← 只登记为组件，不建 encoder</tspan></text>
<text x="58" y="462"><tspan fill="#475569" font-size="12">—— 以上全部在 probe 期间发生；encoder / bridge 的挂接还没开始 ——</tspan></text>
<path d="M248,234 H292 A8,8 0 0 1 300,242 V346 A8,8 0 0 1 292,354 H275" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<text x="292" y="285" text-anchor="end" font-size="11.5" font-weight="600" fill="#94a3b8">回调</text>
<rect x="40" y="524" width="876" height="428" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
<text x="58" y="556"><tspan fill="#0f172a" font-size="13" font-weight="600">③ DRM 组件框架 mtk_drm_drv.c</tspan></text>
<text x="58" y="582"><tspan fill="#475569" font-size="12">组件全部登记完成后，DRM 组件框架开始挨个回调各组件的 .bind：</tspan></text>
<text x="58" y="608"><tspan fill="#2563eb" font-size="12" font-weight="600">mtk_drm_bind()</tspan><tspan fill="#475569" font-size="12">　← 主 DRM 设备的 .bind</tspan></text>
<text x="58" y="634"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="86" fill="#2563eb" font-size="12" font-weight="600">mtk_drm_kms_init()</tspan><tspan fill="#475569" font-size="12">　← 初始化 mode_config，再逐个绑定组件</tspan></text>
<text x="86" y="660"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="114" fill="#2563eb" font-size="12" font-weight="600">component_bind_all()</tspan><tspan fill="#475569" font-size="12">　← 把 .bind 回调分发给所有组件</tspan></text>
<text x="114" y="686"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="142" fill="#2563eb" font-size="12" font-weight="600">mtk_dsi_bind()</tspan><tspan fill="#475569" font-size="12">　← DSI 这一项的 .bind</tspan></text>
<text x="142" y="712"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="170" fill="#2563eb" font-size="12" font-weight="600">mtk_dsi_encoder_init()</tspan><tspan fill="#475569" font-size="12">　← 建 encoder、串桥链、最后生成 connector</tspan></text>
<rect x="192" y="722" width="704" height="106" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="170" y="738"><tspan fill="#475569" font-size="12">├─ </tspan><tspan x="198" fill="#b45309" font-size="12" font-weight="700">drm_bridge_attach(encoder, &amp;dsi-&gt;bridge, NULL, NO_CONNECTOR)</tspan><tspan fill="#475569" font-size="12">　← 核心：把 bridge 挂到 encoder 上</tspan></text>
<text x="170" y="764"><tspan fill="#475569" font-size="12">│</tspan><tspan x="226" fill="#b45309" font-size="12" font-weight="600">①</tspan><tspan fill="#475569" font-size="12"> 校验 previous、登记 bridge-&gt;encoder / bridge-&gt;dev</tspan></text>
<text x="170" y="790"><tspan fill="#475569" font-size="12">│</tspan><tspan x="226" fill="#b45309" font-size="12" font-weight="600">②</tspan><tspan fill="#475569" font-size="12"> 回调 bridge-&gt;funcs-&gt;attach(bridge, flags)</tspan><tspan fill="#b45309" font-size="12" font-weight="600">　★ 驱动实现从这里被调用</tspan></text>
<text x="170" y="816"><tspan fill="#475569" font-size="12">│</tspan><tspan x="226" fill="#b45309" font-size="12" font-weight="600">③</tspan><tspan fill="#475569" font-size="12"> previous-&gt;next = bridge　← 串进 encoder 的 bridge 链</tspan></text>
<text x="170" y="842"><tspan fill="#475569" font-size="12">│</tspan><tspan x="198" fill="#475569" font-size="12">└─ </tspan><tspan x="226" fill="#2563eb" font-size="12" font-weight="600">[回调] mtk_dsi_bridge_attach()</tspan><tspan fill="#475569" font-size="12">　← DSI bridge 的 attach，把下游接上</tspan></text>
<text x="170" y="868"><tspan fill="#475569" font-size="12">│</tspan><tspan x="226" fill="#475569" font-size="12">└─ </tspan><tspan x="254" fill="#b45309" font-size="12" font-weight="600">drm_bridge_attach(encoder, dsi-&gt;next_bridge /* = LT9611 */, &amp;dsi-&gt;bridge, flags)</tspan></text>
<text x="170" y="894"><tspan fill="#475569" font-size="12">│</tspan><tspan x="254" fill="#475569" font-size="12">└─ </tspan><tspan x="282" fill="#2563eb" font-size="12" font-weight="600">[回调] lt9611_bridge_attach()</tspan><tspan fill="#b45309" font-size="12" font-weight="600">　★ 本图要交代的一步</tspan></text>
<text x="170" y="920"><tspan fill="#475569" font-size="12">└─ </tspan><tspan x="198" fill="#2563eb" font-size="12" font-weight="600">drm_bridge_connector_init()</tspan><tspan fill="#475569" font-size="12">　← 按链尾 bridge 的类型生成 connector</tspan></text>
<rect x="24" y="1028" width="912" height="1200" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="24" y="1028" width="912" height="34" rx="10" fill="#22c55e"/>
<rect x="24" y="1052" width="912" height="10" fill="#22c55e"/>
<text x="40" y="1050" font-size="14.5" font-weight="700" fill="#ffffff">插入：显示器拉高 HPD → LT9611 触发中断 → SoC IRQ → 两条路汇合于取模式表（一次 atomic commit）</text>
<rect x="40" y="1080" width="876" height="114" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="478" y="1112" text-anchor="middle"><tspan fill="#2563eb" font-size="12" font-weight="600">lt9611_irq_thread_handler()</tspan></text>
<text x="478" y="1138" text-anchor="middle"><tspan fill="#94a3b8" font-size="15" font-weight="700">↓</tspan></text>
<text x="478" y="1164" text-anchor="middle"><tspan fill="#2563eb" font-size="12" font-weight="600">drm_kms_helper_hotplug_event()</tspan></text>
<path d="M480,1194 V1218" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<path d="M240,1218 H716" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<path d="M240,1218 V1264" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<path d="M716,1218 V1264" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="40" y="1272" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="58" y="1304"><tspan fill="#0f172a" font-size="13" font-weight="600">① 通知用户态</tspan></text>
<text x="58" y="1334"><tspan fill="#2563eb" font-size="12" font-weight="600">drm_sysfs_hotplug_event()</tspan><tspan fill="#475569" font-size="12" font-weight="400"> → uevent</tspan></text>
<text x="58" y="1364"><tspan fill="#475569" font-size="12" font-weight="400">udev / systemd → 合成器</tspan></text>
<text x="58" y="1394"><tspan fill="#2563eb" font-size="11.5" font-weight="600">ioctl(fd, DRM_IOCTL_MODE_GETCONNECTOR, &amp;conn)</tspan></text>
<rect x="516" y="1272" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="534" y="1304"><tspan fill="#0f172a" font-size="13" font-weight="600">② 通知内核态</tspan></text>
<text x="534" y="1330"><tspan fill="#2563eb" font-size="12" font-weight="600">drm_client_dev_hotplug()</tspan></text>
<text x="534" y="1356"><tspan fill="#475569" font-size="12">└─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">client-&gt;funcs-&gt;hotplug()</tspan><tspan fill="#94a3b8" font-size="11">　← fbdev client</tspan></text>
<text x="562" y="1382"><tspan fill="#475569" font-size="12">└─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_fb_helper_hotplug_event()</tspan></text>
<text x="590" y="1408"><tspan fill="#475569" font-size="12">└─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_client_modeset_probe()</tspan></text>
<path d="M240,1432 V1716" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<text x="232" y="1560" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">conn.count_modes != null 时</text>
<path d="M240,1478 H500 V1497" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<text x="248" y="1462" font-size="11" font-weight="600" fill="#64748b">conn.count_modes == null 时</text>
<path d="M716,1432 V1496" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="280" y="1500" width="636" height="164" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="298" y="1528"><tspan fill="#0f172a" font-size="13" font-weight="600">探测</tspan></text>
<text x="298" y="1556"><tspan fill="#475569" font-size="12">├─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">connector-&gt;funcs-&gt;fill_modes()</tspan></text>
<text x="298" y="1584"><tspan fill="#475569" font-size="12">│　　　= </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_helper_probe_single_connector_modes()</tspan><tspan fill="#94a3b8" font-size="12">（标准实现）</tspan></text>
<text x="298" y="1612"><tspan fill="#475569" font-size="12">├─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_helper_probe_detect()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">connector-&gt;funcs-&gt;detect()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_bridge_connector_detect()</tspan></text>
<text x="298" y="1640"><tspan fill="#475569" font-size="12">└─ </tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_detect()</tspan><tspan fill="#475569" font-size="12">　←　读 HPD 寄存器（0x825e）判定 connected</tspan></text>
<path d="M598,1664 V1716" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="40" y="1722" width="876" height="140" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
<text x="58" y="1754"><tspan fill="#0f172a" font-size="13" font-weight="600">取模式表（get_modes）与时序校验</tspan></text>
<text x="58" y="1782"><tspan fill="#475569" font-size="12">├─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">get_modes()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_bridge_connector_get_modes()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_edid_read()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_add_edid_modes()</tspan></text>
<text x="58" y="1810"><tspan fill="#475569" font-size="12">└─ </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_bridge_chain_mode_valid()</tspan><tspan fill="#475569" font-size="12"> → </tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_mode_valid()</tspan><tspan fill="#475569" font-size="12">　← 最大 3840x2160@30Hz</tspan></text>
<text x="58" y="1838"><tspan fill="#94a3b8" font-size="11.5">注：① 用户态经 GETCONNECTOR 拿到的就是这张 mode 表；② 内核 client 仅 console 占用时才真正提交</tspan></text>
<path d="M480,1862 V1888" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="40" y="1894" width="876" height="192" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
<text x="58" y="1926"><tspan fill="#2563eb" font-size="13" font-weight="600">drm_atomic_commit()</tspan></text>
<text x="58" y="1952"><tspan fill="#475569" font-size="12" font-weight="400">├─ check：</tspan><tspan fill="#2563eb" font-size="12" font-weight="600">drm_atomic_helper_bridge_duplicate_state()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　+　</tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_atomic_get_input_bus_fmts()</tspan></text>
<text x="58" y="1978"><tspan fill="#475569" font-size="12" font-weight="400">├─ check：</tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_mode_valid()</tspan></text>
<text x="58" y="2004"><tspan fill="#475569" font-size="12" font-weight="400">├─ commit：</tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_atomic_pre_enable()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　← 仅 sleep == true 时唤醒芯片</tspan></text>
<text x="58" y="2030"><tspan fill="#475569" font-size="12" font-weight="400">├─ commit：</tspan><tspan fill="#2563eb" font-size="12" font-weight="600">encoder-&gt;helper_private-&gt;atomic_enable()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　← 上游 DSI host 送视频流</tspan></text>
<text x="58" y="2056"><tspan fill="#475569" font-size="12" font-weight="400">└─ commit：</tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_atomic_enable()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　★ 画面出现</tspan></text>
<path d="M480,2086 V2110" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="40" y="2118" width="876" height="62" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="478" y="2150" text-anchor="middle"><tspan fill="#2563eb" font-size="12" font-weight="600">atomic_enable()</tspan><tspan fill="#475569" font-size="12" font-weight="400"> 内部：MIPI 输入 → TxPLL → MIPI 时序 → PCR → MIPI AFE → infoframe → HDMI TX / PHY → 使能输出</tspan></text>
<text x="480" y="2204" text-anchor="middle"><tspan fill="#475569" font-size="13" font-weight="400">┈┈┈┈　正常显示中（持续输出）　┈┈┈┈</tspan></text>
<rect x="24" y="2286" width="912" height="476" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="24" y="2286" width="912" height="34" rx="10" fill="#ef4444"/>
<rect x="24" y="2310" width="912" height="10" fill="#ef4444"/>
<text x="40" y="2308" font-size="14.5" font-weight="700" fill="#ffffff">拔出：显示器拉低 HPD → LT9611 触发中断 → SoC IRQ</text>
<rect x="40" y="2338" width="876" height="166" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
<text x="478" y="2370" text-anchor="middle"><tspan fill="#2563eb" font-size="12" font-weight="600">lt9611_irq_thread_handler()</tspan></text>
<text x="478" y="2396" text-anchor="middle"><tspan fill="#94a3b8" font-size="15" font-weight="700">↓</tspan></text>
<text x="478" y="2422" text-anchor="middle"><tspan fill="#2563eb" font-size="12" font-weight="600">drm_kms_helper_hotplug_event()</tspan></text>
<text x="478" y="2448" text-anchor="middle"><tspan fill="#94a3b8" font-size="15" font-weight="700">↓</tspan></text>
<text x="478" y="2474" text-anchor="middle"><tspan fill="#475569" font-size="12" font-weight="400">重新探测：</tspan><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_detect()</tspan><tspan fill="#475569" font-size="12" font-weight="400"> = disconnected，mode 表清空</tspan></text>
<path d="M480,2504 V2528" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ltar)"/>
<rect x="40" y="2536" width="876" height="114" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
<text x="58" y="2568"><tspan fill="#0f172a" font-size="13" font-weight="600">用户态提交一次「关闭」commit</tspan></text>
<text x="58" y="2594"><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_atomic_disable()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　← 关闭 HDMI 输出 + </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">lt9611_power_off()</tspan></text>
<text x="58" y="2620"><tspan fill="#b45309" font-size="12" font-weight="600">★ lt9611_bridge_atomic_post_disable()</tspan><tspan fill="#475569" font-size="12" font-weight="400">　← </tspan><tspan fill="#2563eb" font-size="12" font-weight="600">lt9611_sleep_setup()</tspan><tspan fill="#475569" font-size="12" font-weight="400">，sleep = true</tspan></text>
