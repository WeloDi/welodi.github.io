<!-- 阶段注释 -->
<text x="40" y="1098" font-size="11" fill="#0369a1">① 加载：cfg80211 wiphy_register ← mt7925_register_device（异步 init_work：固件 patch/ram → MAC init → capability → hw_init_done）</text>
<text x="40" y="1116" font-size="11" fill="#15803d">② 运行：mac80211 ← ops → mt7925  → DMA ring ← PCIe → WFDMA ↔ LMAC → PHY/RF　　控制面：host ↔ WF_MCU 固件（TX ring 15 / RX ring 0）</text>
<text x="40" y="1134" font-size="11" fill="#9a3412">③ 关闭：mt7925e_unregister_device → cancel_work → napi_disable → dma_cleanup → set_bit(MT76_REMOVED) → devres 兜底</text>

</svg>