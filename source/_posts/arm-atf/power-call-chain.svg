<svg width="1000" height="760" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a6b8a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b06a2a"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d9460"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">
    PSCI / SCP / SMC / SMCCC / SCPI / SCMI 作用场景
  </text>

  <!-- ================= 左侧：AP 侧 ================= -->
  <rect x="40" y="60" width="420" height="600" rx="8" fill="#f0f6fc" stroke="#a8c8e8"/>
  <text x="250" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">AP（应用处理器）侧</text>

  <!-- Linux 内核 EL1 -->
  <rect x="70" y="110" width="360" height="100" rx="6" fill="#cce4f7" stroke="#4a8ec9"/>
  <text x="250" y="140" text-anchor="middle" font-weight="bold" fill="#1e5a96">Linux 内核（Non-Secure EL1）</text>
  <text x="250" y="165" text-anchor="middle" fill="#22588a">PSCI 客户端 / SCMI 客户端</text>
  <text x="250" y="188" text-anchor="middle" fill="#22588a">发出 SMC，或直接与 SCP 通信</text>

  <!-- BL31 EL3 -->
  <rect x="70" y="330" width="360" height="100" rx="6" fill="#7fbceb" stroke="#1f6cb5"/>
  <text x="250" y="360" text-anchor="middle" font-weight="bold" fill="#0f3d6b">BL31（EL3 安全监控固件）</text>
  <text x="250" y="385" text-anchor="middle" fill="#1b5187">PSCI 服务端 / SMC 分发</text>
  <text x="250" y="408" text-anchor="middle" fill="#1b5187">可选：向 SCP 转发请求</text>

  <!-- BL32 OP-TEE -->
  <rect x="70" y="540" width="360" height="80" rx="6" fill="#a8d0f0" stroke="#2e7bc4"/>
  <text x="250" y="570" text-anchor="middle" font-weight="bold" fill="#1a4d80">BL32 / OP-TEE（Secure EL1）</text>
  <text x="250" y="595" text-anchor="middle" fill="#22588a">安全 OS，运行可信应用 TA</text>

  <!-- ================= 右侧：SCP 侧 ================= -->
  <rect x="540" y="60" width="420" height="600" rx="8" fill="#fdf6ee" stroke="#e8c8a0"/>
  <text x="750" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06a2a">SCP（系统控制处理器）侧</text>

  <!-- SCP 固件 -->
  <rect x="570" y="110" width="360" height="100" rx="6" fill="#fce4c8" stroke="#d98a3a"/>
  <text x="750" y="140" text-anchor="middle" font-weight="bold" fill="#a0521a">SCP 固件（独立小核）</text>
  <text x="750" y="165" text-anchor="middle" fill="#96501a">SCPI/SCMI 服务端</text>
  <text x="750" y="188" text-anchor="middle" fill="#96501a">管理平台资源</text>

  <!-- PMIC / 硬件 -->
  <rect x="570" y="330" width="360" height="100" rx="6" fill="#fad9a8" stroke="#cc7a28"/>
  <text x="750" y="360" text-anchor="middle" font-weight="bold" fill="#8a4412">硬件资源</text>
  <text x="750" y="385" text-anchor="middle" fill="#96501a">PMIC / 时钟 / 传感器 / 电源域</text>
  <text x="750" y="408" text-anchor="middle" fill="#96501a">唤醒源</text>

  <!-- 常开域 -->
  <rect x="570" y="540" width="360" height="80" rx="6" fill="#f7c988" stroke="#c06e1e"/>
  <text x="750" y="570" text-anchor="middle" font-weight="bold" fill="#7a3c0e">常开域（Always-On）</text>
  <text x="750" y="595" text-anchor="middle" fill="#884814">休眠期间检测唤醒事件</text>

  <!-- ================= 通道（只画线） ================= -->

  <line x1="250" y1="210" x2="250" y2="330" stroke="#4a6b8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="160" x2="570" y2="160" stroke="#3d9460" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <line x1="430" y1="380" x2="570" y2="380" stroke="#3d9460" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <line x1="750" y1="210" x2="750" y2="330" stroke="#b06a2a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="750" y1="430" x2="750" y2="540" stroke="#b06a2a" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ================= 动作标签（紧凑小框 + 完整内容） ================= -->

  <!-- 1. SMC：Linux → BL31 -->
  <rect x="70" y="235" width="170" height="40" rx="4" fill="#fff" stroke="#4a6b8a"/>
  <text x="155" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e5a96">SMC（经 SMCCC）</text>
  <text x="155" y="265" text-anchor="middle" font-size="9" fill="#3a6a9a">请求 PSCI：休眠/关机/热插拔</text>

  <!-- 2. SCMI/SCPI 运行期直接通信 -->
  <rect x="420" y="105" width="160" height="40" rx="4" fill="#fff" stroke="#3d9460"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#3d9460">SCMI/SCPI（运行期）</text>
  <text x="500" y="135" text-anchor="middle" font-size="9" fill="#4a7a5a">时钟/传感器/DVFS/电源域</text>

  <!-- 3. SCMI/SCPI 休眠/关机转发 -->
  <rect x="420" y="395" width="160" height="40" rx="4" fill="#fff" stroke="#3d9460"/>
  <text x="500" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#3d9460">SCMI/SCPI（休眠/关机）</text>
  <text x="500" y="425" text-anchor="middle" font-size="9" fill="#4a7a5a">经 BL31 转发系统级请求</text>

  <!-- 4. 直接控制 -->
  <rect x="770" y="235" width="110" height="40" rx="4" fill="#fff" stroke="#b06a2a"/>
  <text x="825" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#a0521a">直接控制</text>
  <text x="825" y="265" text-anchor="middle" font-size="9" fill="#a07040">PMIC/时钟/复位寄存器</text>

  <!-- 5. 唤醒信号 -->
  <rect x="770" y="445" width="110" height="40" rx="4" fill="#fff" stroke="#b06a2a"/>
  <text x="825" y="460" text-anchor="middle" font-size="10" font-weight="bold" fill="#a0521a">唤醒信号</text>
  <text x="825" y="475" text-anchor="middle" font-size="9" fill="#a07040">GPIO/RTC/按键</text>

  <!-- ================= 底部图例 ================= -->
  <rect x="40" y="680" width="920" height="60" rx="6" fill="#f8fafc" stroke="#c8d4e0"/>
  <text x="60" y="700" font-size="12" fill="#334155">
    SMC：ARM 指令，Linux 从 EL1 陷入 EL3；SMCCC：SMC 调用约定
  </text>
  <text x="60" y="718" font-size="12" fill="#334155">
    PSCI：管 CPU/系统级开关，走 SMC 到 EL3；SCPI/SCMI：管平台资源，走共享内存+邮箱到 SCP
  </text>
  <text x="60" y="736" font-size="12" fill="#334155">
    运行期 Linux 可直接用 SCMI/SCPI 访问 SCP；休眠/关机时则由 BL31 转发
  </text>
</svg>