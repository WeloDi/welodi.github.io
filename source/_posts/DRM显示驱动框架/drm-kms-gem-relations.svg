<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 z" fill="#555555"/>
    </marker>
    <marker id="arGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 z" fill="#b8860b"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 z" fill="#c0392b"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1520" height="700" fill="#ffffff"/>

  <!-- 用户空间 -->
  <rect x="40" y="24" width="1176" height="76" rx="10" fill="#eef4fb" stroke="#7aa7d0" stroke-width="1.5"/>
  <text x="64" y="54" font-size="15" font-weight="bold" fill="#1f4e79">用户空间：应用 / 合成器（Weston、SurfaceFlinger…）/ libdrm</text>
  <text x="64" y="80" font-size="13" fill="#39607f">分配 buffer → 描述成 Framebuffer → atomic commit 提交 Plane；收到 page_flip 事件后送下一帧</text>

  <line x1="628" y1="100" x2="628" y2="124" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="640" y="116" font-size="12.5" fill="#666666">ioctl（/dev/dri/card0）</text>

  <!-- 内核空间：drm_device -->
  <rect x="40" y="130" width="1176" height="520" rx="12" fill="#fcfcfd" stroke="#8e8e93" stroke-width="1.5"/>
  <text x="60" y="158" font-size="15" font-weight="bold" fill="#333333">内核空间：drm_device —— 一台显示控制器，对应 /dev/dri/card0</text>

  <!-- 显存（GEM 层）框 -->
  <rect x="60" y="186" width="330" height="440" rx="10" fill="#fffaf0" stroke="#e0a94a" stroke-width="1.5"/>
  <text x="80" y="212" font-size="14" font-weight="bold" fill="#a06a10">显存（GEM 层）</text>

  <!-- GEM object 卡片堆：右下方错位，露出下面两张的左边 -->
  <rect x="80" y="230" width="250" height="126" rx="8" fill="#f4dfb6" stroke="#d99a2b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="92" y="245" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_gem_object（video）</text>

  <rect x="100" y="250" width="250" height="126" rx="8" fill="#fbecd3" stroke="#d99a2b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="112" y="265" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_gem_object（ui）</text>

  <rect x="120" y="270" width="250" height="126" rx="8" fill="#fff8ec" stroke="#c8871a" stroke-width="1.4" filter="url(#sh)"/>
  <text x="132" y="285" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_gem_object（cursor）</text>
  <text x="140" y="327" font-size="12.5" fill="#6b4405">真正存放像素的显存</text>
  <text x="140" y="348" font-size="12.5" fill="#6b4405">分配 / 释放 / dma-buf 共享</text>
  <text x="140" y="369" font-size="12.5" fill="#6b4405">GPU 与显示共用同一块内存</text>

  <line x1="245" y1="396" x2="245" y2="430" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arGold)"/>
  <text x="257" y="418" font-size="12.5" fill="#8a6a00">被描述成</text>

  <!-- Framebuffer 卡片堆 -->
  <rect x="80" y="436" width="250" height="126" rx="8" fill="#f4dfb6" stroke="#d99a2b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="92" y="451" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_framebuffer（video）</text>

  <rect x="100" y="456" width="250" height="126" rx="8" fill="#fbecd3" stroke="#d99a2b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="112" y="471" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_framebuffer（ui）</text>

  <rect x="120" y="476" width="250" height="126" rx="8" fill="#fff8ec" stroke="#c8871a" stroke-width="1.4" filter="url(#sh)"/>
  <text x="132" y="491" font-size="12.5" font-weight="bold" fill="#7a4c05">drm_framebuffer（cursor）</text>
  <text x="140" y="521" font-size="12.5" fill="#6b4405">对 GEM 的扫描输出描述</text>
  <text x="140" y="543" font-size="12.5" fill="#6b4405">format / pitch / size / offset</text>
  <text x="140" y="565" font-size="12.5" fill="#6b4405">本身不含像素；一个 GEM 可多个 FB</text>
  <text x="140" y="587" font-size="12.5" fill="#6b4405">由 ADDFB2 创建，被 Plane 引用才上屏</text>

  <!-- KMS 对象框 -->
  <rect x="406" y="186" width="790" height="440" rx="10" fill="#f2faf4" stroke="#6dbb87" stroke-width="1.5"/>
  <text x="426" y="212" font-size="14" font-weight="bold" fill="#2f7a4a">KMS 对象（全部登记在 drm_mode_config 的各条链表中）</text>

  <!-- Plane 卡片堆 -->
  <rect x="426" y="230" width="150" height="150" rx="8" fill="#c6e6d2" stroke="#4ea86d" stroke-width="1.3" filter="url(#sh)"/>
  <text x="438" y="245" font-size="11.5" font-weight="bold" fill="#245e39">drm_plane（video）</text>

  <rect x="446" y="250" width="150" height="150" rx="8" fill="#d8f0e1" stroke="#4ea86d" stroke-width="1.3" filter="url(#sh)"/>
  <text x="458" y="265" font-size="11.5" font-weight="bold" fill="#245e39">drm_plane（ui）</text>

  <rect x="466" y="270" width="150" height="150" rx="8" fill="#eaf8f0" stroke="#3f9160" stroke-width="1.4" filter="url(#sh)"/>
  <text x="478" y="285" font-size="11.5" font-weight="bold" fill="#245e39">drm_plane（cursor）</text>
  <text x="482" y="324" font-size="12.5" fill="#2f5f42">引用 1 个 FB</text>
  <text x="482" y="348" font-size="12.5" fill="#2f5f42">zpos / alpha</text>
  <text x="482" y="372" font-size="12.5" fill="#2f5f42">贴在哪块矩形</text>
  <text x="482" y="396" font-size="12.5" fill="#2f5f42">可缩放旋转</text>

  <line x1="616" y1="325" x2="630" y2="325" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- CRTC -->
  <rect x="632" y="230" width="124" height="190" rx="8" fill="#e6f5ea" stroke="#4ea86d" stroke-width="1.3"/>
  <text x="646" y="265" font-size="12.5" font-weight="bold" fill="#245e39">drm_crtc</text>
  <text x="646" y="291" font-size="12.5" fill="#2f5f42">时序发生器</text>
  <text x="646" y="317" font-size="12.5" fill="#2f5f42">按 display_mode</text>
  <text x="646" y="343" font-size="12.5" fill="#2f5f42">产生行/场同步</text>
  <text x="646" y="369" font-size="12.5" fill="#2f5f42">vblank 中断</text>
  <text x="646" y="395" font-size="12.5" fill="#2f5f42">可重配时序</text>

  <line x1="756" y1="325" x2="770" y2="325" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Encoder -->
  <rect x="772" y="230" width="124" height="190" rx="8" fill="#e6f5ea" stroke="#4ea86d" stroke-width="1.3"/>
  <text x="786" y="278" font-size="12.5" font-weight="bold" fill="#245e39">drm_encoder</text>
  <text x="786" y="304" font-size="12.5" fill="#2f5f42">信号转换</text>
  <text x="786" y="330" font-size="12.5" fill="#2f5f42">并行像素流 →</text>
  <text x="786" y="356" font-size="12.5" fill="#2f5f42">DSI/LVDS/HDMI</text>
  <text x="786" y="382" font-size="12.5" fill="#2f5f42">控制器内部逻辑</text>

  <line x1="896" y1="325" x2="910" y2="325" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Bridge -->
  <rect x="912" y="230" width="124" height="190" rx="8" fill="#e6f5ea" stroke="#4ea86d" stroke-width="1.3"/>
  <text x="926" y="278" font-size="12.5" font-weight="bold" fill="#245e39">drm_bridge</text>
  <text x="926" y="304" font-size="12.5" fill="#2f5f42">转接站（可选）</text>
  <text x="926" y="330" font-size="12.5" fill="#2f5f42">独立注册、可级联</text>
  <text x="926" y="356" font-size="12.5" fill="#2f5f42">如 DSI→HDMI 桥</text>
  <text x="926" y="382" font-size="12.5" fill="#2f5f42">无芯片时可省</text>

  <line x1="1036" y1="325" x2="1050" y2="325" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Connector -->
  <rect x="1052" y="230" width="124" height="190" rx="8" fill="#e6f5ea" stroke="#4ea86d" stroke-width="1.3"/>
  <text x="1066" y="265" font-size="12.5" font-weight="bold" fill="#245e39">drm_connector</text>
  <text x="1066" y="291" font-size="12.5" fill="#2f5f42">板上的物理接口</text>
  <text x="1066" y="317" font-size="12.5" fill="#2f5f42">如 HDMI 座子</text>
  <text x="1066" y="343" font-size="12.5" fill="#2f5f42">读 EDID / HPD</text>
  <text x="1066" y="369" font-size="12.5" fill="#2f5f42">上报连接状态</text>
  <text x="1066" y="395" font-size="12.5" fill="#2f5f42">提供 mode 列表</text>

  <!-- KMS 说明 -->
  <text x="426" y="452" font-size="12.5" fill="#2f7a4a">• 每个对象在 SoC 内部都有对应的物理单元：</text>
  <text x="426" y="480" font-size="12.5" fill="#2f7a4a">   Plane = 图层混合器，CRTC = 时序发生器，Encoder = 输出口</text>
  <text x="426" y="508" font-size="12.5" fill="#2f7a4a">• 「能接谁」由 possible_crtcs / possible_encoders 声明</text>
  <text x="426" y="536" font-size="12.5" fill="#2f7a4a">• 运行时的绑定关系记在 atomic state，不在链表里</text>
  <text x="426" y="564" font-size="12.5" fill="#2f7a4a">• atomic commit 回调顺序：plane → crtc → encoder → connector</text>
  <text x="426" y="592" font-size="12.5" fill="#2f7a4a">• Bridge 不上报用户空间，drmModeGetResources() 看不到它</text>

  <!-- 显示器（内核之外） -->
  <rect x="1256" y="250" width="200" height="150" rx="10" fill="#fdeeee" stroke="#d98b8b" stroke-width="1.5"/>
  <text x="1276" y="286" font-size="13.5" font-weight="bold" fill="#8c3b3b">显示器 / 面板</text>
  <text x="1276" y="312" font-size="12.5" fill="#7d4a4a">接在接口上的外设</text>
  <text x="1276" y="334" font-size="12.5" fill="#7d4a4a">不是内核对象</text>
  <text x="1276" y="360" font-size="12.5" fill="#7d4a4a">回传 EDID</text>
  <text x="1276" y="382" font-size="12.5" fill="#7d4a4a">产生 HPD</text>

  <line x1="1176" y1="305" x2="1252" y2="305" stroke="#555555" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="1214" y="297" font-size="11.5" fill="#666666" text-anchor="middle">信号</text>

  <line x1="1252" y1="345" x2="1182" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arRed)"/>
  <text x="1217" y="371" font-size="11.5" fill="#c0392b" text-anchor="middle">EDID / HPD</text>

</svg>
