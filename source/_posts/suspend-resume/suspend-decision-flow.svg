<svg width="680" height="516" viewBox="0 0 680 516" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Suspend-resume 排查总决策流程</title>
<desc>先固化现场与日志基线，再依据是否有明确失败设备与错误码分为 A、B 两条路径，最后汇合到压力回归与证据留存。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="200" y="40" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">第 0 步 · 固化现场与日志基线</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">串口 / pstore / pm_debug_messages</text>
<path d="M340 96 L340 136" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170" y="136" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">判据：有明确失败设备与错误码？</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">dmesg + suspend_stats + tracepoint</text>
<path d="M250 192 L250 216 L175 216 L175 240" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430 192 L430 216 L505 216 L505 240" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="175" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">情况 A · 有明确报错</text>
<text x="175" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">顺错误码与回调链定点</text>
<rect x="370" y="240" width="270" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="505" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">情况 B · 无明确报错</text>
<text x="505" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">分层隔离 + 二分 + 状态面对照</text>
<path d="M175 296 L175 336" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 296 L505 336" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="336" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="175" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">错误码 → 设备 → 回调 → 打点</text>
<text x="175" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">dyndbg / ftrace / pm_print_times</text>
<rect x="370" y="336" width="270" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="505" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">pm_test 分层 → 二分 → 状态面</text>
<text x="505" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">唤醒源 / 电源域 / 竞态放大</text>
<path d="M175 392 L175 416 L270 416 L270 440" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 392 L505 416 L410 416 L410 440" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="440" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">压力回归与证据留存</text>
<text x="340" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">rtcwake 100+ 轮 · suspend_stats 复核</text>
</svg>